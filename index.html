<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RetryNow62 - Wiki</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
  <style>
    :root{--accent:#0066cc;--bg:#f7f9fc;--card:#ffffff}
    body{font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;margin:0;background:var(--bg);color:#111}
    header{background:linear-gradient(90deg,#fff 0,#f1f6fb);border-bottom:1px solid #e6eef7;padding:18px 24px}
    .wrap{max-width:1000px;margin:20px auto;display:grid;grid-template-columns:260px 1fr;gap:20px;padding:0 16px}
    .sidebar{background:var(--card);border:1px solid #e6eef7;padding:14px;border-radius:8px}
    .logo{font-weight:700;color:var(--accent);font-size:18px;margin-bottom:8px}
    .pages{list-style:none;padding:0;margin:8px 0}
    .pages a{display:block;padding:8px;border-radius:6px;color:#0b3b66;text-decoration:none}
    .pages a.active{background:linear-gradient(90deg,rgba(0,102,204,0.08),transparent)}
    main{background:var(--card);border:1px solid #e6eef7;padding:18px;border-radius:8px;min-height:320px}
    .meta{font-size:13px;color:#556675;margin-bottom:8px}
    footer{max-width:1000px;margin:18px auto;padding:0 16px;color:#556675;font-size:13px}
    .edit-link{float:right;font-size:13px}
    @media (max-width:720px){.wrap{grid-template-columns:1fr;}.edit-link{float:none;display:block;margin-top:8px}}
  </style>
</head>
<body>
  <header>
    <div class="wrap" style="grid-template-columns:1fr">
      <div style="display:flex;align-items:center;gap:12px">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="24" height="24" rx="4" fill="#0066cc"/><path d="M7 8h10v2H7zM7 12h6v2H7z" fill="#fff"/></svg>
        <div>
          <div style="font-weight:700;font-size:18px">RetryNow62 Wiki</div>
          <div style="font-size:13px;color:#556675">Simple static wiki powered by Markdown</div>
        </div>
      </div>
    </div>
  </header>

  <div class="wrap">
    <nav class="sidebar">
      <div class="logo">Pages</div>
      <ul class="pages" id="pagesList">
        <!-- populated by script -->
      </ul>
      <div style="margin-top:12px;font-size:13px;color:#556675">편집: GitHub에서 파일을 수정하면 내용이 업데이트됩니다.</div>
    </nav>

    <main id="content">
      <div class="meta">
        <span id="pageTitle">Loading...</span>
        <a id="editLink" class="edit-link" target="_blank" rel="noopener">Edit on GitHub</a>
      </div>
      <article id="article">로딩 중...</article>
    </main>
  </div>

  <footer>
    Hosted from the repository retrynow62-eng/retrynow62-eng.github.io • Built as a simple Markdown wiki
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    // repo settings
    const OWNER = 'retrynow62-eng';
    const REPO = 'retrynow62-eng.github.io';
    const BRANCH = 'master';
    const RAW_BASE = `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/wiki/`;
    const EDIT_BASE = `https://github.com/${OWNER}/${REPO}/edit/${BRANCH}/wiki/`;

    // pages list - you can add/remove names here (filenames without .md)
    const PAGES = ['Home','Getting-Started','How-to-Edit'];

    const pagesList = document.getElementById('pagesList');
    const article = document.getElementById('article');
    const pageTitle = document.getElementById('pageTitle');
    const editLink = document.getElementById('editLink');

    function setActive(name){
      Array.from(pagesList.querySelectorAll('a')).forEach(a=>a.classList.toggle('active', a.dataset.page===name));
    }

    function loadPage(name){
      const mdUrl = RAW_BASE + encodeURIComponent(name) + '.md';
      pageTitle.textContent = name;
      editLink.href = EDIT_BASE + encodeURIComponent(name) + '.md';
      setActive(name);
      article.innerHTML = '불러오는 중...';
      fetch(mdUrl).then(r=>{
        if(!r.ok) throw new Error('not found');
        return r.text();
      }).then(md=>{
        article.innerHTML = marked.parse(md);
        // rewrite relative links to point to repo raw or normal links
        Array.from(article.querySelectorAll('a')).forEach(a=>{
          const href = a.getAttribute('href');
          if(href && href.endsWith('.md')){
            // link to our viewer
            const target = href.replace(/\.md$/,'');
            a.href = window.location.pathname + '?page=' + encodeURIComponent(target);
            a.addEventListener('click', e=>{e.preventDefault(); loadPage(target); history.pushState({page:target},'', '?page='+encodeURIComponent(target));});
          }
        });
      }).catch(()=>{
        article.innerHTML = '<p>페이지를 찾을 수 없습니다. GitHub에서 새 문서를 추가하거나 &quot;How-to-Edit&quot; 페이지를 확인하세요.</p>';
      });
    }

    // build sidebar
    PAGES.forEach(p=>{
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = '?page=' + encodeURIComponent(p);
      a.textContent = p.replace(/-/g,' ');
      a.dataset.page = p;
      a.addEventListener('click', e=>{e.preventDefault(); loadPage(p); history.pushState({page:p},'', '?page='+encodeURIComponent(p));});
      li.appendChild(a);
      pagesList.appendChild(li);
    });

    // handle back/forward
    window.addEventListener('popstate', e=>{
      const name = (e.state && e.state.page) || new URLSearchParams(location.search).get('page') || 'Home';
      loadPage(name);
    });

    // initial
    const initial = new URLSearchParams(location.search).get('page') || 'Home';
    loadPage(initial);
  </script>
</body>
</html>
