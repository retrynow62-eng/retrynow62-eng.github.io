services:
  app:
    build:
      context: .
    extra_hosts:
      - host.docker.internal:host-gateway
    env_file:
      - .env
    ports:
      - '3000:3000'
    volumes:
      - ./skins:/usr/src/app/skins
      - ./customStatic:/usr/src/app/customStatic
      - ./plugins:/usr/src/app/plugins
      - ./cache:/usr/src/app/cache
      - ./frontend:/usr/src/app/frontend
      - ./config:/usr/src/app/config
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      MONGODB_HOST: db
      MONGODB_PORT: 27017
      MONGODB_USER: root
      MONGODB_PASSWORD: Nyangcat0621?!
      MONGODB_DATABASE: TheTree

      USE_REDIS: true
      REDIS_HOST: redis
      REDIS_PORT: 6379

      SESSION_SECRET: secretkd9ek2d93id93id93id28si2idjw9skeifjrvidjc9d9d9dodjf9vjvidkcdid9eoe9229wimakisidieieisiiiii
      MEILISEARCH_HOST: http://search:7700
      MEILISEARCH_KEY: thetreepass
      MEILISEARCH_INDEX: TheTreeDocuments
  db:
    image: mongo:latest
    restart: unless-stopped
    volumes:
      - db:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: thetreepass
  redis:
    image: redis:latest
    restart: unless-stopped
    volumes:
      - redis:/data
  search:
    image: getmeili/meilisearch:latest
    restart: unless-stopped
    volumes:
      - search:/meili_data
    environment:
      MEILI_MASTER_KEY: thetreepass

volumes:
  db:
  redis:
  search:
